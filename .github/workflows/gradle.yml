name: "Java CI"
on:
  push:
    branches:
      - '[5-9].[0-9].x'
  pull_request:
    branches:
      - '[5-9].[0-9].x'
  workflow_dispatch:
env:
  GIT_USER_NAME: 'grails-build'
  GIT_USER_EMAIL: 'grails-build@users.noreply.github.com'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "🔨 Run Base Tests"
        run: >
          ./gradlew
          :audit-logging:check
          :examples:audit-test:check
          :examples:audit-test:integrationTest
          :examples:audit-test-allow-update-outside-transaction:check
          :examples:audit-test-allow-update-outside-transaction:integrationTest
          --continue
      - name: "☄️ Upload Base Tests Results - audit-test"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testreport-audit-test-21
          path: examples/audit-test/build/reports/tests
      - name: "☄️ Upload Base Tests Results - audit-test-allow-update-outside-transaction"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testreport-audit-test-allow-update-outside-transaction-21
          path: examples/audit-test-allow-update-outside-transaction/build/reports/tests
      - name: "🔨 Run audit-test Outside of Transaction Tests"
        if: ${{ always() }}
        run: ./gradlew --system-prop audit-test.AuditTrail.datasource=default :examples:audit-test:check --continue
      - name: "☄️ Upload audit-test Outside of Transaction Tests Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testreport-audit-test-single-datasource-21
          path: examples/audit-test/build/reports/tests
  test-gradle-wrapper:
    runs-on: windows-latest
    steps:
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v4
      - name: "Test Gradle wrapper Java discovery"
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/Test-GradleWrapper.ps1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/7.0.x'
    needs: [build, test-gradle-wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout the repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "📤 Publish to Maven Central Snapshots"
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          MAVEN_PUBLISH_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD }}
          MAVEN_PUBLISH_URL: https://central.sonatype.com/repository/maven-snapshots/
        run: ./gradlew :audit-logging:publish
      - name: "📜 Generate Documentation"
        if: success()
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew :audit-logging:docs
      - name: "🚀 Publish to Github Pages"
        if: success()
        uses: grails/github-pages-deploy-action@grails
        env:
          SKIP_SNAPSHOT: ${{ contains(needs.publish.outputs.release_version, 'M') }}
          TARGET_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: plugin/build/docs
          DOC_FOLDER: gh-pages
          COMMIT_EMAIL: ${{ env.GIT_USER_EMAIL }}
          COMMIT_NAME: ${{ env.GIT_USER_NAME }}
